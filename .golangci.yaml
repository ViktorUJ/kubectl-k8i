version: "2"
linters:
  enable:
    - bodyclose
    - gosec
    - misspell
    - noctx
  settings:
    gosec:
      excludes:
        - G104
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
